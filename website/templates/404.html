<!DOCTYPE html>
<html lang="{{ get_locale() }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ _('Страница не найдена') }} — EnPlans</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #f4f6f8; color: #2c3e50;
      font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 24px;
    }
    .box { width: 100%; max-width: 460px; text-align: center; }
    .icon {
      color: #dc3545; margin-bottom: 12px;
      animation: bounce 3s ease-in-out infinite;
    }
    @keyframes bounce { 0%,20%,50%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } 60% { transform: translateY(-3px); } }
    h1 { font-size: 3.5rem; font-weight: 700; margin: 0; line-height: 1; }
    h2 { font-size: 1.35rem; font-weight: 600; color: #495057; margin: 6px 0 0; }
    .card {
      margin-top: 20px; background: #fff; border: 1px solid #e9ecef;
      border-radius: 10px; padding: 28px 24px;
    }
    p { color: #6c757d; font-size: .95rem; margin: 0 0 20px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .7rem 1.4rem; border: 1px solid transparent; border-radius: 8px;
      font: inherit; font-weight: 500; text-decoration: none; cursor: pointer;
    }
    .btn-outline { background: transparent; border-color: #6c757d; color: #6c757d; }
    .btn-outline:hover { background: #6c757d; color: #fff; }
    .btn-primary { background: #00798f; color: #fff; }
    .btn-primary:hover { background: #026476; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-width="2"/>
        <path d="M15 9L9 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M9 9L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>404</h1>
    <h2>{{ _('Страница не найдена') }}</h2>
    <div class="card">
      <p>
        {{ _('Запрашиваемая страница не существует или была перемещена.') }}
      </p>
      <div class="actions">
        <button onclick="history.back()" class="btn btn-outline">{{ _('Назад') }}</button>
        <a href="{{ url_for('views.begin_page') }}" class="btn btn-primary">{{ _('На главную') }}</a>
      </div>
    </div>
  </div>
</body>
</html>
